name: 🚢 Dispatch Pipeline

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📡 Ingest AIS Data
        run: python scripts/ingest_ais.py
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}

      - name: 🧹 Clean Destinations
        run: python scripts/clean_destinations.py

      - name: 💾 Upsert Parquet
        run: python scripts/upsert_parquet.py

      - name: 📝 Generate Log
        run: python scripts/generate_log.py

      - name: 🤖 Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Automated data refresh & log generation'
          file_pattern: 'data/*.parquet docs/DISPATCH_LOG.md'
          branch: main

      - name: 📢 Discord Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            TITLE="🚢 Pipeline Run Succeeded"
            COLOR=3800990
            STATUS_DESC="All ingestion and ETL steps completed without errors."
          else
            TITLE="⚠️ Pipeline Run Failed"
            COLOR=16727386
            STATUS_DESC="One or more steps failed during execution. Inspect logs immediately."
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -H "Content-Type: application/json" -X POST -d '{
            "username": "Oceanic Dispatch Sentinel",
            "avatar_url": "https://img.icons8.com/fluency/96/cargo-ship.png",
            "embeds": [{
              "title": "'"$TITLE"'",
              "url": "'"$RUN_URL"'",
              "description": "'"$STATUS_DESC"'",
              "color": '"$COLOR"',
              "fields": [
                {
                  "name": "🌐 Coverage Zones",
                  "value": "`Malacca` • `Suez` • `English Channel`",
                  "inline": false
                },
                {
                  "name": "🔍 Run Details",
                  "value": "[View Run #'"${{ github.run_id }}"']('"$RUN_URL"')",
                  "inline": true
                }
              ],
              "footer": {
                "text": "Oceanic Command Center"
              }
            }]
          }' "${{ secrets.DISCORD_WEBHOOK }}"